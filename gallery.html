<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gallery | St. Stephen's Luzira C.O.U</title>
    <meta name="description" content="View photos and memories from past events at St. Stephen's Luzira C.O.U.">
    <meta name="theme-color" content="#0e1020">
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/about.css">
    <link rel="stylesheet" href="css/gallery.css">
</head>

<body>
    <header class="hdr" id="site-header"></header>

    <main id="main">
        <!-- Page Hero -->
        <section class="ph gallery-hero">
            <div class="wrap">
                <h1>Our Gallery</h1>
                <div class="crumbs"><a href="index.html">Home</a><i>│</i>Gallery</div>
            </div>
        </section>

        <!-- Dynamic Gallery Content -->
        <section class="sec gallery-sec">
            <div class="wrap rv">
                <div class="head head-center" style="margin-bottom: 50px;">
                    <div>
                        <h2>Moments of Faith & Fellowship</h2>
                        <p class="sub" style="margin: 0 auto; text-align: center; max-width: 65ch;">
                            Browse through our cherished memories. From powerful worship services to community outreach, see what God is doing in our midst.
                        </p>
                    </div>
                </div>

                <div id="gallery-container">
                    <p>Loading gallery…</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" hidden>
        <button class="lightbox-close" aria-label="Close lightbox">&times;</button>
        <img src="" alt="Enlarged photo" id="lightbox-img">
    </div>

    <footer id="site-footer"></footer>

    <button id="bub" aria-expanded="false" aria-controls="pan">Plan Your First Visit<small>We can’t wait to meet you!</small></button>
    <div id="pan">
        <h3>Plan your first visit</h3>
        <form data-ok="Thank you! We will look out for you.">
            <input name="n" placeholder="Your name" aria-label="Your name" required>
            <input name="p" placeholder="Phone or email" aria-label="Phone or email" required>
            <input name="d" type="date" aria-label="Visit date">
            <button class="btn" type="submit">Send</button>
        </form>
    </div>
    <button id="top" aria-label="Back to top">↑</button>

    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script src="js/gallery.js"></script>
</body>

</html>
