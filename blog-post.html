<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Article | St. Stephen's Luzira C.O.U</title>
    <meta name="theme-color" content="#0e1020">
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/about.css">
    <link rel="stylesheet" href="css/blog.css">
</head>
<body>
    <header class="hdr" id="site-header"></header>

    <main id="main">
        <!-- Blog Hero -->
        <section class="blog-hero">
            <div class="wrap">
                <span class="blog-category" id="post-category">Devotional</span>
                <h1 class="blog-title" id="post-title">Loading Title...</h1>
                
                <div class="blog-meta">
                    <div class="author-avatar" id="post-avatar"></div>
                    <span id="post-author">Loading...</span>
                    <span class="divider">|</span>
                    <span id="post-date">Date</span>
                </div>
            </div>
        </section>

        <!-- Featured Image -->
        <div class="blog-hero-img-wrap">
            <div class="wrap">
                <img src="" alt="Featured Image" id="post-hero-img" class="blog-hero-img">
            </div>
        </div>

        <!-- Article Content -->
        <article class="blog-article">
            <div class="wrap">
                <div class="blog-content" id="post-content">
                    <p>Loading content…</p>
                </div>
            </div>
        </article>
    </main>

    <footer id="site-footer"></footer>

    <button id="bub" aria-expanded="false" aria-controls="pan">Plan Your First Visit<small>We can’t wait to meet you!</small></button>
    <div id="pan">
        <h3>Plan your first visit</h3>
        <form data-ok="Thank you! We will look out for you.">
            <input name="n" placeholder="Your name" aria-label="Your name" required>
            <input name="p" placeholder="Phone or email" aria-label="Phone or email" required>
            <input name="d" type="date" aria-label="Visit date">
            <button class="btn" type="submit">Send</button>
        </form>
    </div>
    <button id="top" aria-label="Back to top">↑</button>

    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script src="js/blog-post.js"></script>
</body>
</html>
