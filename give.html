<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Give | St. Stephen's Luzira C.O.U</title>
    <meta name="description" content="Support the ministry of St. Stephen's Luzira C.O.U through your generous giving.">
    <meta name="theme-color" content="#0e1020">
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/about.css">
    <link rel="stylesheet" href="css/give.css">
</head>

<body>
    <header class="hdr" id="site-header"></header>

    <main id="main">
        <!-- Page Hero -->
        <section class="ph give-hero">
            <div class="wrap">
                <h1>Give</h1>
                <div class="crumbs"><a href="index.html">Home</a><i>│</i>Give</div>
            </div>
        </section>

        <!-- Intro Section -->
        <section class="sec give-intro">
            <div class="wrap rv">
                <div class="head head-center" style="margin-bottom: 30px;">
                    <div>
                        <h2>Partner With Us</h2>
                        <p class="sub" style="margin: 0 auto; text-align: center; max-width: 65ch;">
                            "Each of you should give what you have decided in your heart to give, not reluctantly or under compulsion, for God loves a cheerful giver." — 2 Corinthians 9:7
                        </p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Dynamic Giving Options -->
        <section class="sec give-options">
            <div class="wrap rv" id="giving-container">
                <p>Loading giving options…</p>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <button id="bub" aria-expanded="false" aria-controls="pan">Plan Your First Visit<small>We can’t wait to meet you!</small></button>
    <div id="pan">
        <h3>Plan your first visit</h3>
        <form data-ok="Thank you! We will look out for you.">
            <input name="n" placeholder="Your name" aria-label="Your name" required>
            <input name="p" placeholder="Phone or email" aria-label="Phone or email" required>
            <input name="d" type="date" aria-label="Visit date">
            <button class="btn" type="submit">Send</button>
        </form>
    </div>
    <button id="top" aria-label="Back to top">↑</button>

    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script src="js/give.js"></script>
</body>

</html>
